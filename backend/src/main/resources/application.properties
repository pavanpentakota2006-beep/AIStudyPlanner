# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ai_study_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Script Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Authentication Config
app.jwt-secret=9a2f8c4e7b1d3f5a6c8e0b2d4f6a8c0e2f4a6b8c0d2e4f6a8c0b2d4e6f8a0b2c
app.jwt-expiration-milliseconds=86400000

# OpenAI API Config
openai.api.key=${OPENAI_API_KEY:demo-api-key}
openai.model=gpt-4o-mini
